    <circle cx="52" cy="52" r="36" fill="none" stroke="#7180ad" stroke-opacity=".5" stroke-width="2.5" stroke-dasharray="6 7"/>
    <circle cx="52" cy="16" r="5.5" fill="#f19a6b"/><circle cx="88" cy="52" r="5.5" fill="#8d9cff"/>
    <circle cx="52" cy="88" r="5.5" fill="#71d8b8"/><circle cx="16" cy="52" r="5.5" fill="#e4e8f3"/>
