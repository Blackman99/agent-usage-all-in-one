<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Agent Usage</title>
  <desc id="desc">One local dashboard for coding-agent quota, tokens, and equivalent API cost.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1540" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111a34"/>
      <stop offset=".55" stop-color="#0a0f1d"/>
      <stop offset="1" stop-color="#111b2f"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1260 80) rotate(135) scale(440 330)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7184ff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7184ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(1100 440) rotate(-90) scale(340 470)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62d9bd" stop-opacity=".24"/>
      <stop offset="1" stop-color="#62d9bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meter" x1="1135" y1="350" x2="1325" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8391ff"/>
      <stop offset="1" stop-color="#69e4c6"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="480" rx="36" fill="url(#background)"/>
  <rect width="1600" height="480" rx="36" fill="url(#glowA)"/>
  <rect width="1600" height="480" rx="36" fill="url(#glowB)"/>
