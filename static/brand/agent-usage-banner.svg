  <g transform="translate(92 300)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="600">
    <rect width="126" height="48" rx="24" fill="#202a45"/><text x="24" y="31" fill="#e8ecf8">Codex</text>
